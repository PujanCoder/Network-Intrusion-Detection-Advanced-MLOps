stages:
  ml_pipeline:
    cmd: python -m src.pipelines.pipeline

    deps:
      - src/pipelines/pipeline.py
      - src/features/data_cleaning.py
      - src/features/data_preprocessing.py
      - src/features/feature_transformation.py
      - src/features/transformation_validation.py
      - src/models/train_model.py
      - src/models/evaluate_model.py
      - data/raw/MachineLearningCSV/Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv

    params:
      - model
      - mlflow
      - data

    outs:
      - data/processed/cleaned_dataset.csv
      - data/processed/transformed
      - models/best_model.joblib
      - models/preprocessor.joblib        # NEW

    metrics:
      - reports/training_results.json:
          cache: false

  validate_preprocessor:                  # sibling of ml_pipeline — 2 spaces
    cmd: python -m src.serving.validate_artifacts
    deps:
      - models/best_model.joblib
      - models/preprocessor.joblib
      - src/serving/validate_artifacts.py
    params:
      - model.path
      - model.preprocessor_path
    outs:
      - reports/serving_validation.json:
          cache: false