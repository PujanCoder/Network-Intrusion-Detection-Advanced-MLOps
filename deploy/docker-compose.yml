services:
  serving:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.serving
    ports: ["8000:8000"]
    environment:
      IDS_API_KEY: ${IDS_API_KEY}
    volumes:
      - ../data/live:/app/data/live
    restart: unless-stopped

  sensor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sensor
    cap_add: [NET_RAW, NET_ADMIN]
    network_mode: host
    environment:
      SENSOR_API_URL: http://127.0.0.1:8000
      SENSOR_API_KEY: ${SENSOR_API_KEY}
      SENSOR_INTERFACE: ${IFACE:-eth0}
    depends_on: [serving]
    restart: unless-stopped