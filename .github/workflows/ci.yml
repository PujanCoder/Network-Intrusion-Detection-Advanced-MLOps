name: Continuous Integration

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and DVC validation
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__)"
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import evidently; print('Evidently:', evidently.__version__)"
          python -c "import mlflow; print('MLflow:', mlflow.__version__)"
          python -c "import dagshub; print('DagsHub:', dagshub.__version__)"
          python -c "import dvc; print('DVC:', dvc.__version__)"
          python -c "import fastapi, pydantic_settings; print('FastAPI:', fastapi.__version__)"

      - name: Check dependency conflicts
        run: python -m pip check

      - name: Compile source and tests
        run: python -m compileall -q src tests scripts train.py sensor.py

      - name: Lint (errors only)
        run: |
          python -m pip install ruff
          python -m ruff check --select E9,F63,F7,F82 src tests scripts train.py sensor.py

      - name: Validate DVC pipeline definition
        run: |
          python -m dvc stage list
          python -m dvc dag

      - name: Pull batch model artefacts (optional)
        if: env.DAGSHUB_USER_TOKEN != ''
        run: |
          python -m dvc remote modify origin --local auth basic
          python -m dvc remote modify origin --local user pujanpandey012
          python -m dvc remote modify origin --local password "$DAGSHUB_USER_TOKEN"
          if python -m dvc pull models/best_model.joblib models/preprocessor.joblib; then
            echo "NDR_REQUIRE_ARTIFACTS=1" >> "$GITHUB_ENV"
          else
            echo "::warning::DVC pull failed; artefact-dependent tests will be skipped."
          fi

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: API smoke test
        env:
          NDR_DB_PATH: /tmp/ndr-ci/ndr.db
          NDR_ZEEK_LOG_DIR: /tmp/ndr-ci/zeek
          NDR_INGEST_ENABLED: "false"
          NDR_FRONTEND_DIST: /tmp/ndr-ci/dist
        run: |
          mkdir -p /tmp/ndr-ci/zeek
          python -m uvicorn src.api.app:app --host 127.0.0.1 --port 8099 --log-level warning &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health -o /tmp/ndr-ci/health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path("/tmp/ndr-ci/health.json").read_text())
          print(json.dumps(payload, indent=2))
          if payload.get("status") != "ok":
              sys.exit("API health check failed")
          if payload.get("database", {}).get("integrity") != "ok":
              sys.exit("database integrity check failed")
          print("model_loaded:", payload.get("model_loaded"))
          PY

      - name: Serving app smoke test
        env:
          IDS_ZEEK_LOG_DIR: /tmp/nids-ci/zeek
        run: |
          mkdir -p /tmp/nids-ci/zeek
          # Two instances: one with a key (the healthy shape), one without (the
          # misconfigured shape that reached production and returned 503 everywhere).
          IDS_API_KEY=ci-serving-key IDS_DB_PATH=/tmp/nids-ci/ids.db \
            python -m uvicorn src.serving.app:app --host 127.0.0.1 --port 8098 --log-level warning &
          keyed_pid=$!
          IDS_API_KEY= IDS_DB_PATH=/tmp/nids-ci/nokey.db \
            python -m uvicorn src.serving.app:app --host 127.0.0.1 --port 8097 --log-level warning &
          nokey_pid=$!
          trap 'kill $keyed_pid $nokey_pid' EXIT
          python - <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          KEYED = "http://127.0.0.1:8098"
          NOKEY = "http://127.0.0.1:8097"

          def call(base, path, key=None, payload=None):
              request = urllib.request.Request(base + path)
              if key:
                  request.add_header("X-API-Key", key)
              if payload is not None:
                  request.data = json.dumps(payload).encode()
                  request.add_header("Content-Type", "application/json")
                  request.method = "POST"
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, json.load(error)

          for base in (KEYED, NOKEY):
              for _ in range(30):
                  try:
                      if call(base, "/api/v1/health")[0] == 200:
                          break
                  except Exception:
                      pass
                  time.sleep(1)
              else:
                  sys.exit(f"{base} never became healthy")

          code, health = call(KEYED, "/api/v1/health")
          print(json.dumps(health, indent=2))
          if code != 200:
              sys.exit(f"health must be public, got {code}")
          if health["components"]["zeek_model"]["loaded"] is not True:
              sys.exit("Zeek model must load from the tracked artefact")
          if health["components"]["auth"] != {"configured": True, "source": "IDS_API_KEY"}:
              sys.exit(f"IDS_API_KEY not picked up: {health['components']['auth']}")
          if "cicids_model" in health["degraded_components"]:
              print("note: CICIDS artefacts absent in CI (expected without dvc pull)")

          code, body = call(KEYED, "/api/v1/zeek/status")
          if code != 401 or body["detail"]["code"] != "invalid_api_key":
              sys.exit(f"missing key must be rejected, got {code} {body}")
          code, body = call(KEYED, "/api/v1/zeek/status", "bad-key")
          if code != 401:
              sys.exit(f"wrong key must be rejected, got {code}")

          record = {"ts": 1700000000.0, "uid": "Cci0001", "id.orig_h": "10.0.0.5", "id.orig_p": 41000,
                    "id.resp_h": "10.0.0.9", "id.resp_p": 23, "proto": "tcp", "service": "-",
                    "duration": 0.0, "orig_bytes": 0, "resp_bytes": 0, "conn_state": "S0",
                    "orig_pkts": 1, "resp_pkts": 0, "orig_ip_bytes": 60, "resp_ip_bytes": 0}
          code, pushed = call(KEYED, "/api/v1/zeek/ingest/records", "ci-serving-key", {"records": [record]})
          print("ingest:", pushed)
          if code != 200 or pushed["scored"] != 1:
              sys.exit("a conn record must be scored by the Zeek model in CI")

          # No key at all: the app must stay observable and the write path closed.
          code, health = call(NOKEY, "/api/v1/health")
          if code != 200 or health["components"]["auth"]["configured"] is not False:
              sys.exit(f"health must stay public and report the missing key, got {code}")
          code, body = call(NOKEY, "/api/v1/zeek/status")
          if code != 503 or body["detail"]["code"] != "auth_not_configured":
              sys.exit(f"unconfigured deployment must fail closed with a reason, got {code} {body}")
          print("serving smoke test passed")
          PY

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build dashboard
        working-directory: frontend
        run: npm run build

      - name: Report committed bundle drift
        working-directory: frontend
        continue-on-error: true
        run: |
          if [ -d ../.git ]; then
            git -C .. status --porcelain dist || true
          fi

      - name: Upload dashboard bundle
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.serving
          push: false
          tags: ndr-serving:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build sensor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.sensor
          push: false
          tags: ndr-sensor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
