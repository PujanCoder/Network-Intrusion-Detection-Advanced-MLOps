
name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: |
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__)"
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import evidently; print('Evidently:', evidently.__version__)"
          python -c "import mlflow; print('MLflow:', mlflow.__version__)"
          python -c "import dagshub; print('DagsHub:', dagshub.__version__)"
          python -c "import dvc; print('DVC:', dvc.__version__)"

      - name: Check dependency conflicts
        run: python -m pip check

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build dashboard
        working-directory: frontend
        run: npm run build

      - name: Upload dashboard bundle
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist
          retention-days: 7
