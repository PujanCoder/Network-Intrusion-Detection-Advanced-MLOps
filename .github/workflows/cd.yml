name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:                                          # ← JOB level, not step
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_SESSION_TOKEN: ""                       # ← explicitly blank (DagsHub rejects it)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]"

      - name: Verify credentials are in scope
        run: |
          echo "Access length: ${#AWS_ACCESS_KEY_ID}"
          echo "Secret length: ${#AWS_SECRET_ACCESS_KEY}"
          echo "Token set: ${AWS_SESSION_TOKEN:+yes}"

      - name: Pull DVC data
        run: dvc pull -r origin -v

      - name: Run pipeline
        run: python -m src.pipelines.pipeline
