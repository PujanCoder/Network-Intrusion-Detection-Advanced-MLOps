name: cd
on:
  push:
    branches: [main]
    paths:
      - 'src/serving/**'
      - 'src/sensor/**'
      - 'src/features/**'
      - 'models/**'
      - 'params.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install
        run: pip install -r requirements.txt

      - name: Validate artifacts (fail fast)
        run: python -m src.serving.validate_artifacts

      - name: Smoke test predictor
        run: pytest tests/test_feature_contract.py -x

      - name: Build serving image
        run: docker build -f deploy/Dockerfile.serving -t nids-serving:${{ github.sha }} .

      - name: Build sensor image
        run: docker build -f deploy/Dockerfile.sensor -t nids-sensor:${{ github.sha }} .

      # push steps depend on your registry (GHCR/ECR/...)