name: cd

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "models/**"
      - "frontend/**"
      - "deploy/**"
      - "params.yaml"
      - "dvc.yaml"
      - "dvc.lock"
      - "requirements.txt"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build deployable images
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate DVC pipeline definition
        run: |
          python -m dvc stage list
          python -m dvc dag

      - name: Import smoke test
        run: |
          python -c "import src.api.app, src.api.routes, src.api.predictor"
          python -c "import src.realtime.service, src.realtime.store, src.realtime.model"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.serving
          push: false
          tags: nids-serving:${{ github.sha }}

      - name: Build sensor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.sensor
          push: false
          tags: nids-sensor:${{ github.sha }}

      # Registry push is intentionally left to the operator; it needs
      # credentials for GHCR/ECR that are not configured in this repository.
