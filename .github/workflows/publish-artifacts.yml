name: publish-artifacts

# Publishes the DVC-tracked CICIDS artefacts to the DagsHub remote.
#
# The Render service pulls models/best_model.joblib and models/preprocessor.joblib
# from that remote during its build. Those files are gitignored DVC outputs, so
# they only reach the remote when something pushes them - run this workflow once
# after a model change, or run `dvc push` from a machine that has them locally.
#
# Manual on purpose: it needs the raw CICIDS2017 capture and 10-20 minutes of
# training, which is too heavy to run on every push.

on:
  workflow_dispatch:
    inputs:
      retrain:
        description: "Run the DVC pipeline before pushing (otherwise only push existing outputs)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pull the raw dataset
        run: python -m dvc pull -r origin data/raw/MachineLearningCSV.dvc

      - name: Train and evaluate
        if: inputs.retrain
        run: python -m src.pipelines.pipeline

      - name: Push artefacts to DagsHub
        run: |
          test -f models/best_model.joblib
          test -f models/preprocessor.joblib
          python -m dvc push -r origin models/best_model.joblib models/preprocessor.joblib

      - name: Report
        run: |
          echo "Published:" && du -h models/best_model.joblib models/preprocessor.joblib
